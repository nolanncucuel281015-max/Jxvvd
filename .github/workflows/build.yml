name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      images_run:
        description: "Numéro d'un run [showcase] dont on réimprime les images dans le journal (vide : rien)"
        required: false
        default: ""
      images_filter:
        description: "Motif (grep -E) des images à réimprimer"
        required: false
        default: "."

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: evotool-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar


      - name: Server self-test
        run: |
          mkdir -p run-selftest && echo "eula=true" > run-selftest/eula.txt
          timeout 900 ./gradlew runSelftest 2>&1 | tee selftest.log | grep -E "evotool|EVOTOOL|ERROR|Exception|Mixin" || true
          echo "----- résultat -----"
          grep -E "EVOTOOL SELFTEST" selftest.log || true
          if grep -iE "(error|warn).*(evotool)|(evotool).*(fail|error|couldn't|unable)" run-selftest/logs/latest.log | grep -v "SELFTEST PASSED"; then
            echo "Des erreurs liées au mod ont été trouvées dans le log du serveur."; exit 1
          fi
          grep -q "EVOTOOL SELFTEST PASSED" selftest.log

      # Diagnostic : si quelque chose échoue, affiche des API Minecraft utiles (noms Yarn).
      - name: Show Minecraft API on failure
        if: failure()
        run: |
          for JAR in $(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name 'minecraft-*.jar' ! -name '*sources*' 2>/dev/null | grep -i yarn); do
            echo "##### $JAR"
            for c in net.minecraft.screen.AnvilScreenHandler net.minecraft.screen.ForgingScreenHandler; do
              javap -p -cp "$JAR" "$c" 2>/dev/null || true
            done
          done

      # Test visuel dans le vrai client (commit contenant [visual]) : captures d'écran affichées dans le journal.
      - name: Visual client test
        if: contains(github.event.head_commit.message, '[visual]')
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils imagemagick > /dev/null 2>&1 || true
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace > clientgametest.log 2>&1 || echo "client gametest exit $?"
          grep -vE "^\s+at |^\s+\.\.\. |ALSA lib|flite|Suppressed:|Realms" clientgametest.log | grep -E "^\[|Exception|Error|Caused" | head -220 || true
          for f in $(find . -name 'latest.log' -path '*clientGameTest*' -not -path './.gradle/*'); do echo "##### $f"; grep -vE "^\s+at |ALSA|flite" "$f" | tail -120; done
          find . -path ./.gradle -prune -o -name '*.png' -path '*screenshot*' -print | head -20
          for f in $(find . -path ./.gradle -prune -o -name '*evotool_*.png' -print | sort); do
            convert "$f" -resize 640x -quality 82 /tmp/shot.jpg
            echo "=== SHOT $(basename "$f") $(stat -c %s /tmp/shot.jpg)"
            base64 -w 3000 /tmp/shot.jpg
            echo "=== END"
          done

      # Inspection ponctuelle de Minecraft (commit contenant [inspect]).
      - name: Inspect vanilla Minecraft
        if: always() && contains(github.event.head_commit.message, '[inspect]')
        run: bash tools/inspect.sh

  # Images de présentation du mod (commit contenant [showcase]) : un vrai monde, sans interface, en 1920 x 1080.
  # Les PNG sont dans l'artefact « evotool-images » ; des JPEG sont aussi imprimés dans le journal.
  # Le plugin Paper (dossier plugin/) : compilé, puis testé sur un vrai serveur Paper 1.21.11.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew -p plugin build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: evotool-plugin
          path: plugin/build/libs/*.jar

      - name: Download Paper 1.21.11
        run: |
          set -e
          URL=$(curl -fsSL -H "User-Agent: evotool-ci" https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest | jq -r '.downloads["server:default"].url' || true)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            BUILD=$(curl -fsSL https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds | jq -r '.builds[-1].build')
            URL="https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds/$BUILD/downloads/paper-1.21.11-$BUILD.jar"
          fi
          echo "Paper : $URL"
          mkdir -p paper-server/plugins
          curl -fsSL -H "User-Agent: evotool-ci" -o paper-server/paper.jar "$URL"

      - name: Plugin self-test on Paper
        run: |
          cd paper-server
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > server.properties
          # premier démarrage : Paper crée ses fichiers de configuration et s'arrête
          timeout 600 java -jar paper.jar --initSettings --nogui > init.log 2>&1 || true
          cp ../plugin/build/libs/*.jar plugins/
          timeout 900 java -Devotool.selftest=true -jar paper.jar --nogui < /dev/null > server.log 2>&1 || true
          grep -iE "evotool|evo tool|EVOTOOL" server.log | head -200 || true
          echo "----- résultat -----"
          cat plugins/EvoTool/selftest.txt || true
          if grep -nE "Exception|Error" server.log | grep -iE "evotool" ; then
            echo "Erreurs du plugin dans le log du serveur :"; grep -nE -B2 -A25 "Exception" server.log | head -200; exit 1
          fi
          grep -q "EVOTOOL SELFTEST PASSED" plugins/EvoTool/selftest.txt

      - name: Server log on failure
        if: failure()
        run: tail -300 paper-server/server.log || true

  showcase:
    if: contains(github.event.head_commit.message, '[showcase]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Showcase screenshots
        continue-on-error: true
        env:
          EVOTOOL_SHOWCASE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils imagemagick > /dev/null 2>&1 || true
          timeout 3000 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace > showcase.log 2>&1 || echo "client gametest exit $?"
          grep -vE "ALSA lib|flite|Suppressed:|Realms" showcase.log | grep -E "SHOWCASE|Exception|Error|Caused|at fr\.evotool|at net\.fabricmc\.fabric\.impl\.client\.gametest" | head -150 || true
          for f in $(find . -path ./.gradle -prune -o -name 'crash-*.txt' -print); do echo "##### $f"; grep -vE "^\s+at (java|jdk|com\.mojang|io\.netty)" "$f" | head -90; done
          mkdir -p showcase-images
          for f in $(find . -path ./.gradle -prune -o -name '*showcase_*.png' -print | sort); do
            cp "$f" showcase-images/
          done
          ls -la showcase-images

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: evotool-images
          path: showcase-images/*.png

  # Les images en JPEG dans le journal (en 3 parties : un journal trop gros est coupé).
  showcase-print:
    needs: showcase
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evotool-images
          path: imgs

      - name: Print images
        run: |
          command -v convert > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null 2>&1)
          for f in $(ls imgs/*.png | sort | awk -v p=${{ matrix.part }} '(NR - 1) % 4 == p'); do
            convert "$f" -quality 85 /tmp/shot.jpg
            # deux copies : une ligne du journal se perd parfois, la somme de contrôle dit laquelle est intacte
            for copy in 1 2; do
              echo "=== SHOT $(basename "$f") $(stat -c %s /tmp/shot.jpg) $(md5sum < /tmp/shot.jpg | cut -c1-32)"
              base64 -w 1000 /tmp/shot.jpg
              echo "=== END"
              sleep 2
            done
          done

  # Réimprime les images d'un run [showcase] précédent (lancement manuel, champ images_run).
  reprint-images:
    if: github.event_name == 'workflow_dispatch' && inputs.images_run != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evotool-images
          path: imgs
          run-id: ${{ inputs.images_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print images
        env:
          FILTER: ${{ inputs.images_filter }}
        run: |
          command -v convert > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null 2>&1)
          for f in $(ls imgs/*.png | sort | grep -E "$FILTER"); do
            convert "$f" -quality 85 /tmp/shot.jpg
            for copy in 1 2; do
              echo "=== SHOT $(basename "$f") $(stat -c %s /tmp/shot.jpg) $(md5sum < /tmp/shot.jpg | cut -c1-32)"
              base64 -w 1000 /tmp/shot.jpg
              echo "=== END"
              sleep 2
            done
          done
