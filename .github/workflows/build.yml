name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: evotool-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar


      - name: Server self-test
        run: |
          mkdir -p run-selftest && echo "eula=true" > run-selftest/eula.txt
          timeout 900 ./gradlew runSelftest 2>&1 | tee selftest.log | grep -E "evotool|EVOTOOL|ERROR|Exception|Mixin" || true
          echo "----- résultat -----"
          grep -E "EVOTOOL SELFTEST" selftest.log || true
          if grep -iE "(error|warn).*(evotool)|(evotool).*(fail|error|couldn't|unable)" run-selftest/logs/latest.log | grep -v "SELFTEST PASSED"; then
            echo "Des erreurs liées au mod ont été trouvées dans le log du serveur."; exit 1
          fi
          grep -q "EVOTOOL SELFTEST PASSED" selftest.log

      # Diagnostic : si quelque chose échoue, affiche des API Minecraft utiles (noms Yarn).
      - name: Show Minecraft API on failure
        if: failure()
        run: |
          for JAR in $(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name 'minecraft-*.jar' ! -name '*sources*' 2>/dev/null | grep -i yarn); do
            echo "##### $JAR"
            for c in net.minecraft.screen.AnvilScreenHandler net.minecraft.screen.ForgingScreenHandler; do
              javap -p -cp "$JAR" "$c" 2>/dev/null || true
            done
          done

      # Inspection ponctuelle de Minecraft (commit contenant [inspect]).
      - name: Inspect vanilla Minecraft
        if: always() && contains(github.event.head_commit.message, '[inspect]')
        run: |
          set +e
          ALL=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' ! -name '*sources*' 2>/dev/null)
          for JAR in $ALL; do
            for f in assets/minecraft/items/netherite_spear.json assets/minecraft/models/item/netherite_spear.json assets/minecraft/models/item/netherite_spear_in_hand.json data/minecraft/enchantment/lunge.json data/minecraft/recipe/netherite_spear_smithing.json assets/minecraft/models/item/spear_in_hand.json data/minecraft/recipe/diamond_spear.json; do
              if unzip -l "$JAR" "$f" >/dev/null 2>&1; then echo "=== $f ($JAR)"; unzip -p "$JAR" "$f"; echo; fi
            done
            unzip -l "$JAR" | awk '{print $4}' | grep -i -E 'spear|lunge' | grep -v -E '^net/' | head -40
            for png in assets/minecraft/textures/item/netherite_spear_in_hand.png assets/minecraft/textures/item/netherite_spear.png assets/minecraft/textures/item/netherite_sword.png; do
              if unzip -l "$JAR" "$png" >/dev/null 2>&1; then echo "PNGB64 $png $(unzip -p "$JAR" "$png" | base64 -w0)"; fi
            done
            for t in $(unzip -l "$JAR" | awk '{print $4}' | grep 'data/minecraft/tags/item/enchantable/'); do
              if unzip -p "$JAR" "$t" | grep -q -i spear; then echo "=== $t"; unzip -p "$JAR" "$t"; echo; fi
            done
          done
          for JAR in $(echo "$ALL" | tr ' ' '\n' | grep -i yarn); do
            echo "##### $JAR"
            javap -cp "$JAR" 'net.minecraft.item.Item$Settings' 2>/dev/null | grep -i -E 'spear|kinetic|piercing|swing'
            javap -cp "$JAR" net.minecraft.component.DataComponentTypes 2>/dev/null | grep -i -E 'kinetic|piercing|swing|use_effect|charge|weapon'
            javap -c -cp "$JAR" net.minecraft.item.Items 2>/dev/null | grep -n -B2 -A45 'String netherite_spear' | head -120
            javap -cp "$JAR" net.minecraft.enchantment.Enchantments 2>/dev/null | grep -i lunge
          done
