name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: evotool-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar


      - name: Server self-test
        run: |
          mkdir -p run-selftest && echo "eula=true" > run-selftest/eula.txt
          timeout 900 ./gradlew runSelftest 2>&1 | tee selftest.log | grep -E "evotool|EVOTOOL|ERROR|Exception|Mixin" || true
          echo "----- résultat -----"
          grep -E "EVOTOOL SELFTEST" selftest.log || true
          if grep -iE "(error|warn).*(evotool)|(evotool).*(fail|error|couldn't|unable)" run-selftest/logs/latest.log | grep -v "SELFTEST PASSED"; then
            echo "Des erreurs liées au mod ont été trouvées dans le log du serveur."; exit 1
          fi
          grep -q "EVOTOOL SELFTEST PASSED" selftest.log

      # Diagnostic : si quelque chose échoue, affiche des API Minecraft utiles (noms Yarn).
      - name: Show Minecraft API on failure
        if: failure()
        run: |
          for JAR in $(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name 'minecraft-*.jar' ! -name '*sources*' 2>/dev/null | grep -i yarn); do
            echo "##### $JAR"
            for c in net.minecraft.screen.AnvilScreenHandler net.minecraft.screen.ForgingScreenHandler; do
              javap -p -cp "$JAR" "$c" 2>/dev/null || true
            done
          done

      # Test visuel dans le vrai client (commit contenant [visual]) : captures d'écran affichées dans le journal.
      - name: Visual client test
        if: contains(github.event.head_commit.message, '[visual]')
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils imagemagick > /dev/null 2>&1 || true
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace > clientgametest.log 2>&1 || echo "client gametest exit $?"
          grep -vE "^\s+at |^\s+\.\.\. |ALSA lib|flite|Suppressed:|Realms" clientgametest.log | grep -E "^\[|Exception|Error|Caused" | head -220 || true
          for f in $(find . -name 'latest.log' -path '*clientGameTest*' -not -path './.gradle/*'); do echo "##### $f"; grep -vE "^\s+at |ALSA|flite" "$f" | tail -120; done
          find . -path ./.gradle -prune -o -name '*.png' -path '*screenshot*' -print | head -20
          for f in $(find . -path ./.gradle -prune -o -name '*evotool_*.png' -print | sort); do
            convert "$f" -resize 640x -quality 82 /tmp/shot.jpg
            echo "=== SHOT $(basename "$f") $(stat -c %s /tmp/shot.jpg)"
            base64 -w 3000 /tmp/shot.jpg
            echo "=== END"
          done

      # Inspection ponctuelle de Minecraft (commit contenant [inspect]).
      - name: Inspect vanilla Minecraft
        if: always() && contains(github.event.head_commit.message, '[inspect]')
        run: bash tools/inspect.sh

  # Images de présentation du mod (commit contenant [showcase]) : un vrai monde, sans interface, en 1920 x 1080.
  # Les PNG sont dans l'artefact « evotool-images » ; des JPEG sont aussi imprimés dans le journal.
  showcase:
    if: contains(github.event.head_commit.message, '[showcase]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Showcase screenshots
        continue-on-error: true
        env:
          EVOTOOL_SHOWCASE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils imagemagick > /dev/null 2>&1 || true
          timeout 3000 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace > showcase.log 2>&1 || echo "client gametest exit $?"
          grep -vE "ALSA lib|flite|Suppressed:|Realms" showcase.log | grep -E "SHOWCASE|Exception|Error|Caused|at fr\.evotool|at net\.fabricmc\.fabric\.impl\.client\.gametest" | head -150 || true
          for f in $(find . -path ./.gradle -prune -o -name 'crash-*.txt' -print); do echo "##### $f"; grep -vE "^\s+at (java|jdk|com\.mojang|io\.netty)" "$f" | head -90; done
          mkdir -p showcase-images
          for f in $(find . -path ./.gradle -prune -o -name '*showcase_*.png' -print | sort); do
            cp "$f" showcase-images/
          done
          ls -la showcase-images

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: evotool-images
          path: showcase-images/*.png

      - name: Print images
        run: |
          for f in $(ls showcase-images/*.png | sort); do
            convert "$f" -quality 85 /tmp/shot.jpg
            echo "=== SHOT $(basename "$f") $(stat -c %s /tmp/shot.jpg) $(md5sum < /tmp/shot.jpg | cut -c1-32)"
            base64 -w 1000 /tmp/shot.jpg
            echo "=== END"
            sleep 2
          done
